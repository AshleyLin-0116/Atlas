name: Weekly Email Cron

on:
  schedule:
    - cron: '0 12 * * *'  # Every day at 12pm UTC
  workflow_dispatch:       # Allow manual trigger from GitHub Actions tab

jobs:
  send-weekly-email:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly email endpoint
        run: |
          curl -X POST https://atlas-backend-476l.onrender.com/cron/weekly-email \
            -H "Content-Type: application/json" \
            -d '{"secret": "${{ secrets.CRON_SECRET }}"}'